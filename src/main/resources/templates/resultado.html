<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado Final</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="scrollavel">
<div class="container-col">

    <!-- Mensagem flash -->
    <div class="alert alert-sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="card" style="text-align: center;">
        <h1 class="title">Resultado!</h1>

        <p style="color: rgba(255,255,255,0.7); margin-bottom: 10px;">
            Corrida: <strong th:text="${corrida.titulo}"></strong>
        </p>

        <p style="color: rgba(255,255,255,0.7); margin-bottom: 30px;">
            Jogador: <strong th:text="${participante}"></strong>
        </p>

        <p style="font-size: 3rem; color: var(--accent); font-weight: 800;">
            <span th:text="${pontuacao}"></span> pts
        </p>

        <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 10px;">
            <a th:href="@{/ranking}">
                <button class="btn">Ver Ranking 🏆</button>
            </a>
            <a th:href="@{/lobby}">
                <button class="btn" style="background: rgba(255,255,255,0.1); box-shadow: none;">
                    Jogar Novamente
                </button>
            </a>
        </div>
    </div>

</div>
</body>
</html>
