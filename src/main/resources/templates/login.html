<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - QuizzGame</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="centralizado">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h1 class="title" style="text-align: center;">🏁 QuizzGame</h1>
        <p style="text-align: center; margin-bottom: 20px; color: rgba(255,255,255,0.7);">Faça login para jogar ou gerenciar</p>

        <div th:if="${param.error}" class="alert alert-erro">
            Usuário ou senha inválidos. Tente novamente!
        </div>
        <div th:if="${param.logout}" class="alert alert-sucesso">
            Você saiu do sistema com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            
            <label style="display:block; margin-bottom: 5px; font-weight: 600;">Usuário:</label>
            <input type="text" name="username" class="input" required placeholder="ex: joao ou admin_master"/>

            <label style="display:block; margin-bottom: 5px; font-weight: 600; margin-top: 15px;">Senha:</label>
            <input type="password" name="password" class="input" required placeholder="ex: 12345"/>

            <button class="btn" type="submit" style="margin-top: 20px;">Entrar</button>
        </form>
        
    </div>
</body>
</html>
