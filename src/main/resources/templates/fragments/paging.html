<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
<body>
    
    <section th:fragment="paginator(resourcePath, navPage)">
        <nav th:if="${navPage.totalPages > 0}">
            <ul class="paginador" style="list-style: none; padding: 0;">

                <!-- Primeira página -->
                <li class="pag-item" th:classappend="${navPage.currentPage == 1} ? 'desabilitado'">
                    <a th:replace="fragments/paging :: page(1, ${navPage.pageSize}, '«', 'Primeira', ${resourcePath})"></a>
                </li>

                <!-- Página anterior -->
                <li class="pag-item" th:classappend="${navPage.currentPage == 1} ? 'desabilitado'">
                    <a th:replace="fragments/paging :: page(${navPage.currentPage - 1}, ${navPage.pageSize}, 'Anterior', 'Página anterior', ${resourcePath})"></a>
                </li>

                <!-- Reticências à esquerda -->
                <li class="pag-item desabilitado" th:if="${navPage.currentPage - 2 > 1}">
                    <span class="pag-link">…</span>
                </li>

                <!-- Links para páginas próximas -->
                <li class="pag-item" th:classappend="${page == navPage.currentPage} ? 'ativo'"
                    th:each="page : ${#numbers.sequence(
                        navPage.currentPage > 2 ? navPage.currentPage - 2 : 1,
                        navPage.currentPage + 2 < navPage.totalPages ? navPage.currentPage + 2 : navPage.totalPages
                    )}">
                    <a th:replace="fragments/paging :: page(${page}, ${navPage.pageSize}, ${page}, 'Página ' + ${page}, ${resourcePath})"></a>
                </li>

                <!-- Reticências à direita -->
                <li class="pag-item desabilitado" th:if="${navPage.currentPage + 2 < navPage.totalPages}">
                    <span class="pag-link">…</span>
                </li>

                <!-- Próxima página -->
                <li class="pag-item" th:classappend="${navPage.currentPage == navPage.totalPages} ? 'desabilitado'">
                    <a th:replace="fragments/paging :: page(${navPage.currentPage + 1}, ${navPage.pageSize}, 'Próxima', 'Próxima página', ${resourcePath})"></a>
                </li>

                <!-- Última página -->
                <li class="pag-item" th:classappend="${navPage.currentPage == navPage.totalPages} ? 'desabilitado'">
                    <a th:replace="fragments/paging :: page(${navPage.totalPages}, ${navPage.pageSize}, '»', 'Última', ${resourcePath})"></a>
                </li>

            </ul>
        </nav>
    </section>

    <a th:fragment="page(pageNum, pageSize, label, tooltip, resourcePath)"
       class="pag-link"
       th:href="@{'/' + ${resourcePath} + '?page=' + ${pageNum} + '&size=' + ${pageSize}}"
       th:title="${tooltip}"
       rel="tooltip">
        [[${label}]]
    </a>

    <div th:fragment="sizeSelector(resourcePath, navPage)">
    <form method="get" th:action="@{'/' + ${resourcePath}}" class="size-selector" style="display: flex; align-items: center; gap: 10px;">
        <label for="sizeInput">Itens por página:</label>
        <input type="number" id="sizeInput" name="size" 
            list="tamanhosSugeridos" 
            min="1" step="1" 
            th:value="${navPage.pageSize}" 
            style="width: 100px; padding: 8px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; -moz-appearance: textfield;"
       onfocus="this.style.outline='none'">
            <datalist id="tamanhosSugeridos">
            <option value="1">
            <option value="2">
            <option value="3">
            <option value="4">
            <option value="5">
            <option value="6">
        </datalist>
        <input type="hidden" name="page" th:value="${navPage.currentPage}" />
        <button type="submit" class="btn" style="padding: 8px 16px; width: auto; font-size: 0.9rem; background: var(--accent); box-shadow: 0 4px 0 #c0394d;">Aplicar</button>
    </form>
</div>

</body>
</html>
