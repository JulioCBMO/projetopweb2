<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <div th:replace="~{fragments/nav :: navbar(${nomeParticipante})}"></div>
</head>
<body >
    <div th:fragment="content" class="container-col">

    <h1 class="title">🏆 Ranking</h1>

    <!-- Seletor de tamanho -->
        <div class="w-100" style="display: flex; justify-content: flex-end;">
            <div th:replace="~{fragments/paging :: sizeSelector('ranking', ${navPage})}"></div>
        </div>

    <!-- Sem resultados -->
    <div th:if="${resultados.isEmpty()}" class="card">
        <p style="text-align:center;">Nenhuma corrida disputada ainda.</p>
    </div>

    <!-- Tabela de ranking -->
    <table class="ranking-table" th:if="${!resultados.isEmpty()}">
        <thead>
            <tr>
                <th>#</th>
                <th>Jogador</th>
                <th>Corrida</th>
                <th>Pontuação</th>
                <th>Data</th>
            </tr>
        </thead>
       <tbody>
                <tr th:each="resultado : ${resultados.content}" th:classappend="${resultado.participante.nome == nomeParticipante} ? 'destaque'">
                    <td th:text="${resultado.participante.nome}"></td>
                    <td th:text="${resultado.corrida.titulo}"></td>
                    <td th:text="${resultado.pontuacao}"></td>
                    <td th:text="${#temporals.format(resultado.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
                <tr th:if="${resultados.empty}">
                    <td colspan="4" style="text-align: center; color: rgba(255,255,255,0.6);">Nenhum resultado registrado ainda.</td>
                </tr>
            </tbody>
        </table>

        <!-- Paginador -->
        <div th:replace="~{fragments/paging :: paginator('ranking', ${navPage})}"></div>

    </div>
    </div>

</div>
</body>
</html>
