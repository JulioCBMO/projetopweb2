<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="scrollavel">
<div class="container-col">

    <h1 class="title">🏆 Ranking</h1>

    <!-- Sem resultados -->
    <div th:if="${resultados.isEmpty()}" class="card">
        <p style="text-align:center;">Nenhuma corrida disputada ainda.</p>
    </div>

    <form method="get" action="/ranking">
    <label for="sizeSelect">Itens por página:</label>
    <select id="sizeSelect" name="size" onchange="this.form.submit()">
        <option value="2" th:selected="${navPage.pageSize == 2}">2</option>
        <option value="4" th:selected="${navPage.pageSize == 4}">4</option>
        <option value="6" th:selected="${navPage.pageSize == 6}">6</option>
    </select>
    <input type="hidden" name="page" th:value="${navPage.currentPage}" />
</form>

    <!-- Tabela de ranking -->
    <table class="ranking-table" th:if="${!resultados.isEmpty()}">
        <thead>
            <tr>
                <th>#</th>
                <th>Jogador</th>
                <th>Corrida</th>
                <th>Pontuação</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r, iterStat : ${resultados}"
                th:classappend="${r.participante.nome == nomeParticipante} ? 'destaque'">
                <td th:text="${iterStat.count}"></td>
                <td th:text="${r.participante.nome}"></td>
                <td th:text="${r.corrida.titulo}"></td>
                <td th:text="${r.pontuacao}"></td>
                <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/paging :: paginator('ranking', ${navPage})}"></div>

    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <a th:href="@{/lobby}">
            <button class="btn">Voltar ao Lobby</button>
        </a>
        <a th:href="@{/logout}">
            <button class="btn" style="background: rgba(255,255,255,0.1); box-shadow: none;">
                Sair
            </button>
        </a>
    </div>

</div>
</body>
</html>
