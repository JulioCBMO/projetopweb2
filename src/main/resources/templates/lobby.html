<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><html xmlns:th="http://www.thymeleaf.org">
   
<head>
    <div th:replace="~{fragments/nav :: navbar(${nomeParticipante})}"></div>
    <meta charset="UTF-8">
    <title>Lobby - QuizzGame</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="scrollavel">
    
<div class="container" style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px;">

    <!-- Mensagem flash -->
    <div class="error-messages" th:if="${mensagem}">
        <p th:text="${mensagem}"></p>
    </div>

    <!-- Lista de corridas -->
    <div th:each="corrida : ${corridas}" class="card" style="max-width: 600px;">
        <h2 th:text="${corrida.titulo}"></h2>
        <p th:text="${corrida.descricao}"></p>
        <p>⏱ <span th:text="${corrida.tempoSegundos}"></span> segundos</p>
        <p>❓ <span th:text="${corrida.perguntas.size()}"></span> perguntas</p>

        <form th:action="@{/corrida/iniciar}" method="post">
            <input type="hidden" name="corridaId" th:value="${corrida.id}"/>
            <button class="btn" type="submit"
                th:disabled="${corridasFeitas.contains(corrida.id)}"
                th:text="${corridasFeitas.contains(corrida.id)} ? '✅ Já disputada' : 'ENTRAR NA CORRIDA'">
        </button>
        </form>
    </div>

    <!-- Sem corridas -->
    <div th:if="${corridas.isEmpty()}" class="card">
        <p>Nenhuma corrida disponível no momento.</p>
    </div>
</br> 
</div>
</body>
</html>
